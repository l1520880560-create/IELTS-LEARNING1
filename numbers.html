<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数字复习 · Numbers</title>
<style>
  :root{
    --ink:#2c3e50; --sub:#7f8c8d; --line:#e8eaed; --card:#fff;
    --accent:#1f6feb; --ok:#1a9d5d; --err:#d64541; --bg:#f6f8fa;
    --shadow:0 2px 10px rgba(31,111,235,.08);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--bg); color:var(--ink); font-family:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif; line-height:1.6; padding:22px 16px 80px;}
  .wrap{max-width:960px; margin:0 auto;}
  a{color:var(--accent); text-decoration:none;}
  .crumb{font-size:13px; color:var(--sub); margin-bottom:14px; display:flex; gap:6px; align-items:center; flex-wrap:wrap;}
  .crumb a{cursor:pointer;}
  .crumb .sep{color:#c3c9d1;}
  h1.main{font-size:26px; margin-bottom:4px;}
  p.sub{color:var(--sub); font-size:14px; margin-bottom:20px;}

  /* 模块卡（首页） */
  .mods{display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:14px;}
  .mod{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:22px 18px; cursor:pointer; transition:all .15s; box-shadow:var(--shadow);}
  .mod:hover{transform:translateY(-2px); border-color:var(--accent);}
  .mod .ico{font-size:26px; margin-bottom:10px;}
  .mod h3{font-size:16px; margin-bottom:4px;}
  .mod p{font-size:12.5px; color:var(--sub);}
  .mod .num{font-size:12px; color:var(--accent); margin-top:8px; font-weight:600;}

  /* 类型方块 */
  .tiles{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px;}
  .tile{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:20px 12px; text-align:center; cursor:pointer; transition:all .15s;}
  .tile:hover{transform:translateY(-2px); border-color:var(--accent);}
  .tile h4{font-size:15px; margin-bottom:3px;}
  .tile span{font-size:12px; color:var(--sub);}
  .tile .badge{display:inline-block; margin-top:8px; font-size:11px; color:var(--accent); background:#eef3fc; padding:2px 8px; border-radius:999px;}

  /* 规则卡 */
  .rcards{display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:12px;}
  .rcard{background:var(--card); border:1px solid var(--line); border-radius:12px; cursor:pointer; overflow:hidden; transition:all .15s;}
  .rcard .head{display:flex; align-items:center; justify-content:space-between; padding:14px 16px;}
  .rcard .head h4{font-size:15px;}
  .rcard .head .tag{font-size:11px; background:#eef3fc; color:var(--accent); padding:2px 8px; border-radius:999px; font-weight:600;}
  .rcard .head .arr{color:var(--sub); transition:transform .2s;}
  .rcard.open .head .arr{transform:rotate(90deg);}
  .rcard .body{display:none; padding:0 16px 14px; border-top:1px dashed var(--line);}
  .rcard.open .body{display:block;}
  .rcard .body ul{list-style:none; margin-top:10px;}
  .rcard .body li{font-size:13px; padding:5px 0; border-bottom:1px dashed var(--line);}
  .rcard .body li:last-child{border-bottom:none;}
  .rcard .src{font-size:11px; color:var(--sub);}
  .rcard .src b{color:var(--accent);}
  .rcard .samples{margin-top:10px; display:flex; flex-direction:column; gap:6px;}
  .rcard .srow{display:flex; align-items:center; gap:10px; font-size:14px;}
  .rcard .tips{margin-top:12px; background:#fff8e6; border-left:3px solid #f0b429; padding:8px 10px; font-size:13px; border-radius:0 8px 8px 0;}

  .btn{display:inline-flex; align-items:center; justify-content:center; border:none; cursor:pointer; border-radius:8px; font-size:13px; font-family:inherit;}
  .btn.play{background:#eef3fc; color:var(--accent); width:32px; height:32px; border-radius:50%; font-size:15px;}
  .btn.play:hover{background:#dbe7fb;}
  .btn.big{width:58px; height:58px; border-radius:50%; background:#eef3fc; color:var(--accent); font-size:24px; margin:0 auto 14px;}
  .btn.big:hover{background:#dbe7fb;}
  .btn.ghost{background:#fff; border:1px solid var(--line); color:var(--ink); padding:8px 16px; font-size:13px;}
  .btn.ghost:hover{border-color:var(--accent); color:var(--accent);}
  .btn.primary{background:var(--accent); color:#fff; padding:9px 20px; font-size:14px;}
  .btn.primary:hover{filter:brightness(1.06);}

  /* 机打页 */
  .typecard{background:var(--card); border:1px solid var(--line); border-radius:16px; max-width:620px; margin:10px auto; padding:36px 28px 30px; text-align:center; box-shadow:var(--shadow);}
  .typecard .kind{font-size:13px; color:var(--sub); margin-bottom:6px;}
  .typecard .listen-tip{font-size:14px; color:var(--sub); margin-bottom:18px;}
  .typecard .reveal{font-size:15px; color:var(--ink); margin:16px 0; min-height:24px;}
  .typecard .answer-in{width:100%; max-width:340px; text-align:center; font-size:30px; letter-spacing:2px; padding:12px 10px; border:2px solid var(--line); border-radius:12px; outline:none; font-family:inherit;}
  .typecard .answer-in:focus{border-color:var(--accent);}
  .typecard .answer-in.ok{border-color:var(--ok); background:#f0faf4;}
  .typecard .answer-in.no{border-color:var(--err); background:#fdf3f2;}
  .typecard .hint{font-size:12.5px; color:var(--sub); margin-top:14px;}
  .typecard .hint b{color:var(--accent);}
  .progbar{height:6px; background:#e8eaed; border-radius:3px; margin-bottom:18px; overflow:hidden;}
  .progbar i{display:block; height:100%; background:var(--accent); border-radius:3px; transition:width .25s;}
  .stat{font-size:13px; color:var(--sub); display:flex; justify-content:space-between; margin-bottom:8px;}
  .result{text-align:center; padding:20px 0;}
  .result .big{font-size:46px; font-weight:700; color:var(--accent);}
  .result .cap{font-size:14px; color:var(--sub); margin:6px 0 18px;}
  .rlist{max-width:620px; margin:14px auto; text-align:left;}
  .rlist .rq{display:flex; align-items:center; gap:10px; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 14px; margin-bottom:8px; font-size:14px;}
  .rlist .rq .ok{color:var(--ok); font-weight:700;}
  .rlist .rq .no{color:var(--err); font-weight:700;}
  .rlist .rq .ans{color:var(--sub); font-size:12.5px;}

  /* 句子页 */
  .sentcard{background:var(--card); border:1px solid var(--line); border-radius:16px; max-width:680px; margin:10px auto; padding:30px 26px 26px; text-align:center; box-shadow:var(--shadow);}
  .sentcard .scene{font-size:12.5px; color:var(--sub); margin-bottom:8px;}
  .sentcard .sent-text{font-size:19px; line-height:2; margin:14px 0;}
  .sentcard .blank-in{display:inline-block; text-align:center; font-size:17px; width:110px; margin:0 4px; border:none; border-bottom:2px solid var(--accent); background:transparent; outline:none; font-family:inherit; color:var(--ink);}
  .sentcard .blank-in.ok{color:var(--ok); border-color:var(--ok);}
  .sentcard .blank-in.no{color:var(--err); border-color:var(--err);}
  .sentcard .blank-in:disabled{opacity:.9;}

  /* 对话页 */
  .dlgcard{background:var(--card); border:1px solid var(--line); border-radius:16px; max-width:680px; margin:10px auto; padding:28px 26px; box-shadow:var(--shadow);}
  .dlgcard h4{font-size:17px; margin-bottom:4px;}
  .dlgcard .scene{font-size:13px; color:var(--sub); margin-bottom:14px;}
  .dlgcard .line{display:flex; align-items:center; gap:12px; margin-bottom:10px;}
  .dlgcard .who{font-size:12px; color:var(--sub); width:58px; flex:none;}
  .dlgcard .blank-in{width:150px; border:none; border-bottom:2px solid var(--accent); background:transparent; text-align:center; font-size:16px; outline:none; font-family:inherit; padding:4px;}
  .dlgcard .blank-in.ok{color:var(--ok); border-color:var(--ok);}
  .dlgcard .blank-in.no{color:var(--err); border-color:var(--err);}
  .dlgcard .fb{font-size:12.5px; color:var(--sub);}

  .errs{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px 18px; max-width:680px; margin:0 auto;}
  .errs .empty{color:var(--sub); font-size:14px; text-align:center;}
  .errs .e{display:flex; align-items:center; gap:12px; padding:9px 0; border-bottom:1px dashed var(--line); font-size:14px; flex-wrap:wrap;}
  .errs .e:last-child{border-bottom:none;}
  .errs .e .ans{color:var(--ok); font-weight:600;}
  .errs .e .bad{color:var(--err);}
  footer{color:var(--sub); font-size:12px; margin-top:44px; text-align:center;}
  .hidden{display:none!important;}
/* 剑桥笔记填空版式 */
.notepad{background:#fff;border:1.5px solid #d8dee9;border-radius:10px;padding:16px 18px}
.prompt{color:#5b6b7f;font-style:italic;font-size:13.5px;margin:2px 0 12px}
.example{background:#f2f7ff;border-left:3px solid #4a7dd6;padding:8px 12px;border-radius:6px;margin-bottom:12px;font-size:15px;color:#43536b}
.example .exlbl{display:inline-block;background:#4a7dd6;color:#fff;font-size:11px;border-radius:4px;padding:1px 7px;margin-right:8px;vertical-align:1px}
.ghead{font-weight:600;color:#4a7dd6;font-size:13.5px;margin:14px 0 8px;padding-bottom:4px;border-bottom:1px dashed #d8dee9}
.crow{display:flex;align-items:center;gap:6px;margin:9px 0;font-size:15.5px;color:#26323f;flex-wrap:wrap}
.crow .blank-in{width:110px;font-size:15.5px;padding:6px 9px;border:1.5px solid #b8c4d4;border-radius:6px;text-align:center}
.scene{color:#8a97a8;font-size:12.5px;margin-left:10px}
/* 播放条浮层 */
#playbar{position:fixed;left:0;right:0;bottom:0;background:#1e2a3a;z-index:999;box-shadow:0 -4px 18px rgba(0,0,0,.18);padding:10px 16px}
#playbar .pbinner{display:flex;align-items:center;gap:10px;max-width:980px;margin:0 auto}
#playbar .pbname{color:#9fb2c8;font-size:12px;min-width:70px;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#playbar input[type=range]{flex:1;accent-color:#4a7dd6;cursor:pointer}
#playbar #pbTime{color:#dfe8f3;font-size:13px;min-width:110px;text-align:center}
#playbar select{background:#2b3a4e;color:#eaf1f8;border:1px solid #45566e;border-radius:6px;padding:4px 6px;font-size:13px}
</style>
</head>

/* ================= 判分 ================= */
const monthNum = {january:1,february:2,march:3,april:4,may:5,june:6,july:7,august:8,september:9,october:10,november:11,december:12};
function normDate(s){
  s = s.trim().toLowerCase().replace(/(\d+)(st|nd|rd|th)/g,"$1");
  let m = s.match(/^(\d{1,2})[/.-](\d{1,2})(?:[/.-](\d{2,4}))?$/);
  if(m){ let d=+m[1], mo=+m[2], y=m[3]?+m[3]:0; if(y<100)y+=2000; return {y,mo,d}; }
  m = s.match(/^(\d{1,2})\s+([a-z]+)(?:,?\s+(\d{2,4}))?$/);
  if(m && monthNum[m[2]]){ let d=+m[1], mo=monthNum[m[2]], y=m[3]?+m[3]:0; if(y<100)y+=2000; return {y,mo,d}; }
  m = s.match(/^([a-z]+)(?:\s+(\d{1,2}))?(?:,?\s+(\d{2,4}))?$/);
  if(m && monthNum[m[1]]){ let mo=monthNum[m[1]], d=m[2]?+m[2]:0, y=m[3]?+m[3]:0; if(y<100)y+=2000; return {y,mo,d}; }
  return null;
}
function cmpDate(a,b){ return a.mo===b.mo && a.d===b.d && (!b.y || !a.y || a.y===b.y); }
function normMoney(s){
  s = s.trim().replace(/\s+/g,"");
  let m = s.match(/^([$£€])(\d+(?:\.\d{1,2})?)$/);
  if(!m) return null;
  return {cur:m[1], val:parseFloat(m[2])};
}
function check(input, ans, type){
  let v = input.trim();
  if(!v) return false;
  switch(type){
    case "DIGIT": case "YEAR":
      v = v.replace(/[^\d]/g,""); return v === ans;
    case "TIME": {
      let m = v.match(/^(\d{1,2}):(\d{2})$/); if(!m) return false;
      return m[1].replace(/^0/,"") + ":" + m[2] === ans;
    }
    case "DATE": { let a = normDate(ans), b = normDate(v); return !!(a && b && cmpDate(a,b)); }
    case "MONEY": { let a = normMoney(ans), b = normMoney(v); return !!(a && b && a.cur===b.cur && Math.abs(a.val-b.val)<1e-6); }
    case "CODE": {
      let cv = v.toLowerCase().replace(/[^a-z0-9]/g,""), ca = ans.toLowerCase().replace(/[^a-z0-9]/g,"");
      return cv === ca;
    }
    case "FRAC": { let a = fracVal(ans), b = fracVal(v); return !!(a!==null && b!==null && Math.abs(a-b)<1e-6); }
    case "WORD": return v.toLowerCase().replace(/\s+/g," ") === ans.toLowerCase().replace(/\s+/g," ");
  }
  return false;
}
function fracVal(s){
  s = s.trim().toLowerCase();
  if(s==="½"||s==="1/2"||s==="0.5"||s==="a half"||s==="half") return 0.5;
  if(s==="¼"||s==="0.25") return 0.25;
  if(s==="¾"||s==="0.75") return 0.75;
  let m = s.match(/^(\d+)\s*\/\s*(\d+)$/); if(m){ let d=+m[2]; return d? (+m[1])/d : null; }
  let mx = s.match(/^(\d+)\s+(\d+)\/(\d+)$/); if(mx){ let d=+mx[3]; return d? (+mx[1]) + (+mx[2])/d : null; }
  let f = parseFloat(s); return isNaN(f)? null : f;
}

/* ================= 播放（浮层播放条：可拖动进度 / 调速） ================= */
let curAudio = null, curSrc = null, barTimer = null;
function play(src){
  if(curAudio){ curAudio.pause(); }
  let a = new Audio("audio/"+src);
  curAudio = a; curSrc = src;
  let spd = parseFloat(document.getElementById("spdSel").value) || 1;
  a.playbackRate = spd;
  document.getElementById("playbar").classList.remove("hidden");
  document.getElementById("pbToggle").textContent = "⏸";
  document.getElementById("pbTime").textContent = "0:00 / 0:00";
  document.getElementById("pbSeek").value = 0;
  document.getElementById("pbName").textContent = src;
  a.addEventListener("loadedmetadata", ()=>{
    document.getElementById("pbTime").textContent = "0:00 / " + fmtT(a.duration);
  });
  a.addEventListener("timeupdate", ()=>{
    if(!dragSeeking){
      let d = a.duration || 1;
      document.getElementById("pbSeek").value = Math.round(a.currentTime/d*1000);
      document.getElementById("pbTime").textContent = fmtT(a.currentTime) + " / " + fmtT(a.duration);
    }
  });
  a.addEventListener("ended", ()=>{
    document.getElementById("pbToggle").textContent = "▶";
    document.getElementById("pbSeek").value = 1000;
  });
  a.addEventListener("error", ()=>{
    document.getElementById("pbToggle").textContent = "▶";
    document.getElementById("pbName").textContent = "⚠ 音频缺失或无法播放：" + src;
  });
  a.play();
  if(barTimer) clearTimeout(barTimer);
}
function fmtT(t){
  if(!isFinite(t)) return "0:00";
  let m = Math.floor(t/60), s = Math.floor(t%60);
  return m + ":" + String(s).padStart(2,"0");
}
let dragSeeking = false;
function seekTo(v){
  if(!curAudio) return;
  let d = curAudio.duration || 1;
  curAudio.currentTime = v/1000*d;
}
function togglePb(){
  if(!curAudio) return;
  if(curAudio.paused){ curAudio.play(); document.getElementById("pbToggle").textContent = "⏸"; }
  else{ curAudio.pause(); document.getElementById("pbToggle").textContent = "▶"; }
}
function setSpd(v){
  if(curAudio) curAudio.playbackRate = parseFloat(v) || 1;
}
function closePb(){
  if(curAudio) curAudio.pause();
  document.getElementById("playbar").classList.add("hidden");
}

/* ================= 视图切换 ================= */
function go(view){
  ["v-home","v-rules","v-drill","v-type","v-sent","v-dlgs","v-dlg","v-errs"].forEach(id=>{
    document.getElementById(id).classList.add("hidden");
  });
  document.getElementById(view).classList.remove("hidden");
  window.scrollTo(0,0);
}
function crumb(parts){
  document.getElementById("crumb").innerHTML =
    parts.map((p,i)=> i<parts.length-1 ? `<a onclick="go('${p.v}')">${p.t}</a><span class="sep">/</span>` : `<span>${p.t}</span>`).join("");
}

/* ================= 首页 ================= */
function renderHome(){
  document.getElementById("modGrid").innerHTML = [
    {ico:"📘", t:"规则速查", p:"6 张卡 · 年份/时刻/日期/金钱/号码/辨音", v:"v-rules", n:"6 卡"},
    {ico:"🔢", t:"单数字练习", p:"7 种类型 · 随机抽 8 题机打", v:"v-drill", n:"7 组 · 84 题"},
    {ico:"🗣️", t:"句子实战", p:"医院/学校/车站等 210 句 · 随机抽 10 句", v:"v-sent", n:"210 句", act:"renderSentList()"},
    {ico:"💬", t:"对话实战", p:"仿雅思 Section 1 · 56 段 · 随机抽 2 段", v:"v-dlgs", n:"56 段"},
    {ico:"📝", t:"错题本", p:"答错自动收录 · 重听重练", v:"v-errs", n: errs.length+" 题"}
  ].map(m=>`<div class="mod" onclick="${m.act||('go(\''+m.v+'\')')}"><div class="ico">${m.ico}</div><h3>${m.t}</h3><p>${m.p}</p><div class="num">${m.n}</div></div>`).join("");
}

/* ================= 规则速查 ================= */
function renderRules(){
  let el = document.getElementById("ruleCards");
  el.innerHTML = RULES.map((r,ri)=>{
    let pts = r.pts.map(p=>`<li>${esc(p[0])} <span class="src">【<b>${p[1]}</b>】</span></li>`).join("");
    let smp = r.samples.map(s=>`<div class="srow"><button class="btn play" onclick="play('${s[2]}')">▶</button><span><b>${esc(s[0])}</b> · ${esc(s[1])}</span></div>`).join("");
    let tip = r.tips.map(t=>`<div>💡 ${esc(t[0])} <span class="src">【<b>${t[1]}</b>】</span></div>`).join("");
    return `<div class="rcard" id="rcard_${ri}" onclick="toggleRule(${ri})"><div class="head"><h4>${esc(r.t)}</h4><span class="tag">${esc(r.tag)}</span><span class="arr">▶</span></div><div class="body"><ul>${pts}</ul><div class="samples">${smp}</div><div class="tips">${tip}</div></div></div>`;
  }).join("");
}
function toggleRule(i){
  let c = document.getElementById("rcard_"+i);
  c.classList.toggle("open");
}

/* ================= 类型方块 ================= */
function renderTiles(){
  document.getElementById("drillTiles").innerHTML = GROUPS.map((g,i)=>
    `<div class="tile" onclick="startType(${i})"><h4>${esc(g.t)}</h4><span>${esc(g.d)}</span><div class="badge">题库 ${g.q.length} 题 · 随机抽 10</div></div>`).join("");
}

/* ================= 机打练习 ================= */
let typeState = null;
function shuffle(arr){ let a=arr.slice(); for(let i=a.length-1;i>0;i--){ let j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function startType(gi){
  typeState = { group: GROUPS[gi], list: shuffle(GROUPS[gi].q).slice(0,10), idx:0, right:0, results:[] };
  crumb([{t:"数字复习",v:"v-home"},{t:"单数字练习",v:"v-drill"},{t:GROUPS[gi].t,v:"v-type"}]);
  go("v-type");
  renderTypeQ();
}
function renderTypeQ(){
  let s = typeState;
  if(s.idx >= s.list.length){ renderTypeResult(); return; }
  let q = s.list[s.idx];
  let card = document.getElementById("typeCard");
  card.innerHTML = `
    <div class="kind">${esc(s.group.t)} · 第 ${s.idx+1} / ${s.list.length} 题</div>
    <div class="stat"><span>已答对 ${s.right} 题</span><span>${s.idx+1}/${s.list.length}</span></div>
    <div class="progbar"><i style="width:${s.idx/s.list.length*100}%"></i></div>
    <button class="btn big" onclick="play('${q[0]}')">🔊</button>
    <div class="listen-tip">听录音，在下方输入数字</div>
    <input class="answer-in" id="typeIn" autocomplete="off" placeholder="输入答案" onkeydown="if(event.key==='Enter')submitType()">
    <div class="hint">输入正确自动进入下一题 · 回车提交判错</div>`;
  document.getElementById("typeIn").focus();
}
function submitType(){
  let s = typeState, q = s.list[s.idx], input = document.getElementById("typeIn");
  let v = input.value, ok = check(v, q[1], q[2]);
  if(ok){
    s.right++; s.results.push({ok:true, ans:q[1]});
    input.classList.add("ok"); input.disabled = true;
    setTimeout(()=>{ s.idx++; renderTypeQ(); }, 650);
  }else{
    input.classList.add("no"); input.disabled = true;
    s.results.push({ok:false, ans:q[1], user:v});
    addErr(`${s.group.t} · 机打`, q[0], q[1], q[2], v);
    let hint = document.querySelector(".typecard .hint");
    if(hint) hint.innerHTML = `<span style="color:var(--err)">正确答案：${esc(q[1])}</span>`;
    setTimeout(()=>{ s.idx++; renderTypeQ(); }, 1600);
  }
}
function renderTypeResult(){
  let s = typeState;
  document.getElementById("typeCard").innerHTML = `
    <div class="result">
      <div class="big">${s.right}/${s.list.length}</div>
      <div class="cap">${s.group.t} · 本轮答对率</div>
      <button class="btn primary" onclick="startType(${GROUPS.findIndex(g=>g.id===s.group.id)})">再练一轮</button>
      <button class="btn ghost" style="margin-left:8px" onclick="go('v-drill')">返回类型选择</button>
    </div>`;
}

/* ================= 句子实战 ================= */
let sentState = null;
function renderSentList(){
  crumb([{t:"数字复习",v:"v-home"},{t:"句子实战",v:"v-sent"}]);
  go("v-sent");
  let demo = SENTS.find(x=>x.audio==="num_s11.mp3");
  let demoHtml = demo.base.replace(/\{\{(\d+)\}\}/g,(m,n)=>{
    let b = demo.blanks[+n-1];
    return `<b style="color:var(--err)">${esc(b[0])}</b><span style="color:#8a97a8;font-size:12px"> (${b[1]})</span>`;
  });
  let demos = [demo].concat(SENTS.filter(x=>["num_s01.mp3","num_s02.mp3","num_s03.mp3","num_s04.mp3","num_s05.mp3","num_s06.mp3","num_s07.mp3","num_s08.mp3","num_s09.mp3","num_s10.mp3"].includes(x.audio)));
  document.getElementById("sentDemo").innerHTML = `
    <div class="prompt" style="margin-top:4px">Complete the sentence below. Write ONE WORD AND/OR A NUMBER for each answer.</div>
    <div class="notepad" style="margin-bottom:6px">
      <div class="ghead">试听样例（已有音频 · 点击 ▶ 听，对照题目）</div>
      ${demos.map((d,i)=>{
        let t = d.base.replace(/\{\{(\d+)\}\}/g,(m,n)=>{ let b=d.blanks[+n-1]; return `<b style="color:var(--err)">${esc(b[0])}</b><span style="color:#8a97a8;font-size:12px">(${b[1]})</span>`; });
        return `<div class="crow"><button class="btn play" onclick="play('${d.audio}')">▶</button><span class="scene" style="width:52px">${esc(d.scene)}</span><span>${t}</span></div>`;
      }).join("")}
    </div>
    <button class="btn primary" onclick="startSents()">▶ 开始随机练习（210 句抽 10）</button>`;
  document.getElementById("sentCard").innerHTML = "";
}
function startSents(){
  let picks = shuffle(SENTS).slice(0,10).map(s=>({scene:s.scene, base:s.base, blanks:s.blanks, audio:s.audio}));
  sentState = { list: picks, idx:0, right:0, done:0 };
  crumb([{t:"数字复习",v:"v-home"},{t:"句子实战",v:"v-sent"}]);
  go("v-sent");
  renderSentQ();
}
function renderSentQ(){
  let s = sentState;
  if(s.idx >= s.list.length){ renderSentResult(); return; }
  let it = s.list[s.idx];
  let html = it.base.replace(/\{\{(\d+)\}\}/g,(m,n)=>{
    let b = it.blanks[+n-1];
    return `<input class="blank-in" id="sb_${n}" placeholder="空${n}" autocomplete="off" data-ans="${esc(b[0])}" data-type="${b[1]}" onkeydown="if(event.key==='Enter')submitSent()">`;
  });
  document.getElementById("sentCard").innerHTML = `
    <div class="prompt">Complete the sentence below. Write ONE WORD AND/OR A NUMBER for each answer.</div>
    <div class="scene">${esc(it.scene)} · 第 ${s.idx+1} / ${s.list.length} 句</div>
    <div class="stat"><span>已答对 ${s.right} / ${s.done} 空</span><span>${s.idx+1}/${s.list.length}</span></div>
    <div class="progbar"><i style="width:${s.idx/s.list.length*100}%"></i></div>
    <button class="btn big" onclick="play('${it.audio}')">🔊</button>
    <div class="sent-text">${html}</div>
    <div class="hint">听整句 → 填所有空 → 回车检查（错题自动进错题本）</div>`;
}
function submitSent(){
  let s = sentState, it = s.list[s.idx];
  let all = true;
  it.blanks.forEach((b,bi)=>{
    let input = document.getElementById(`sb_${bi+1}`);
    let v = input.value;
    if(check(v, b[0], b[1])){ s.right++; input.classList.add("ok"); input.disabled=true; }
    else{ all=false; input.classList.add("no"); input.disabled=true; addErr(`句子 · ${it.scene}`, it.audio, b[0], b[1], v); }
  });
  s.done += it.blanks.length;
  let hint = document.querySelector(".sentcard .hint");
  if(!all){
    let wrong = it.blanks.filter((b,bi)=>{ let inp=document.getElementById(`sb_${bi+1}`); return inp.classList.contains("no"); })
      .map(b=>esc(b[0])).join(" / ");
    hint.innerHTML = `<span style="color:var(--err)">正确答案：${wrong}</span>`;
  }else{
    hint.innerHTML = `<span style="color:var(--ok)">✓ 全对！</span>`;
  }
  setTimeout(()=>{ s.idx++; renderSentQ(); }, 1500);
}
function renderSentResult(){
  let s = sentState;
  document.getElementById("sentCard").innerHTML = `
    <div class="result">
      <div class="big">${s.right}/${s.done}</div>
      <div class="cap">句子实战 · 本轮填空答对率</div>
      <button class="btn primary" onclick="startSents()">再来一轮</button>
      <button class="btn ghost" style="margin-left:8px" onclick="go('v-home')">返回首页</button>
    </div>`;
}

/* ================= 对话 ================= */
let dlgState = null;
let dlgPick = [];
function renderDlgs(){
  dlgPick = shuffle(DLGS.slice()).slice(0,2);
  document.getElementById("dlgList").innerHTML = dlgPick.map((d,di)=>{
    let n = d.groups.reduce((a,g)=>a+g.rows.length,0);
    return `<div class="rcard" onclick="startDlg(${di})"><div class="head"><h4>${esc(d.t)}</h4><span class="tag">${n} 空</span><span class="arr">▶</span></div><div class="sub">${esc(d.scene)}</div></div>`;
  }).join("") + `<button class="btn ghost" style="margin-top:14px;width:100%" onclick="renderDlgs()">🎲 换一批 · 再抽 2 段</button>`;
}
function startDlg(di){
  let d = dlgPick[di];
  dlgState = { dlg: d, right:0, done:0, finished:false };
  crumb([{t:"数字复习",v:"v-home"},{t:"对话实战",v:"v-dlgs"},{t:d.t,v:"v-dlg"}]);
  go("v-dlg");
  renderDlgQ();
}
function renderDlgQ(){
  let s = dlgState, d = s.dlg, gi = 0;
  let html = d.groups.map(g=>{
    let rows = g.rows.map(r=>{
      let inp = `<input class="blank-in" id="db_${gi}" style="width:110px" data-ans="${esc(r.ans)}" data-type="${r.type}" onkeydown="if(event.key==='Enter')submitDlg()">`;
      gi++;
      return `<div class="crow"><span>${esc(r.pre||"")}</span>${inp}<span>${esc(r.post||"")}</span></div>`;
    }).join("");
    return `<div class="ghead">${esc(g.h)}</div>${rows}`;
  }).join("");
  let ex = d.example ? `<div class="example"><span class="exlbl">Example</span>${esc(d.example.pre)}<b>${esc(d.example.ans)}</b>${esc(d.example.post)}</div>` : "";
  document.getElementById("dlgCard").innerHTML = `
    <h4>${esc(d.t)}</h4>
    <div class="prompt">${esc(d.prompt)}</div>
    <div style="margin-bottom:14px"><button class="btn play" onclick="play('${d.audio}')">▶ 播放整段对话</button><span class="scene">${esc(d.scene)}</span></div>
    <div class="notepad">${ex}${html}</div>
    <div style="margin-top:12px"><button class="btn primary" onclick="submitDlg()">检查全部</button> <span class="fb" id="dlgfb"></span></div>`;
}
function submitDlg(){
  let s = dlgState, d = s.dlg, all = true, msgs = [];
  let blanks = [];
  d.groups.forEach(g=>g.rows.forEach(r=>blanks.push(r)));
  blanks.forEach((b,bi)=>{
    let input = document.getElementById(`db_${bi}`);
    let v = input.value;
    if(check(v, b.ans, b.type)){ input.classList.add("ok"); }
    else{ all=false; input.classList.add("no"); msgs.push(`空${bi+1}: ${b.ans}`); addErr(`对话 · ${d.t} · 空${bi+1}`, d.audio, b.ans, b.type, v); }
  });
  s.right = blanks.filter((b,bi)=>document.getElementById(`db_${bi}`).classList.contains("ok")).length;
  s.done = blanks.length;
  let fb = document.getElementById("dlgfb");
  if(all){ fb.innerHTML = '<span style="color:var(--ok)">✓ 整段全对！</span>'; }
  else{ fb.innerHTML = '<span style="color:var(--err)">✗ 有错误：' + msgs.join("，") + '</span>'; }
  if(!s.finished){
    s.finished = true;
    setTimeout(()=>{
      document.getElementById("dlgCard").innerHTML = `
        <div class="result">
          <div class="big">${s.right}/${s.done}</div>
          <div class="cap">${esc(d.t)} · 填空答对率</div>
          <button class="btn primary" onclick="startDlg(${DLGS.findIndex(x=>x===d)})">再听一遍</button>
          <button class="btn ghost" style="margin-left:8px" onclick="go('v-dlgs')">返回对话列表</button>
        </div>`;
    }, 2200);
  }
}

/* ================= 错题本 ================= */
function renderErrs(){
  let el = document.getElementById("errList");
  if(!errs.length){ el.innerHTML = '<div class="empty">暂无错题，继续加油！</div>'; return; }
  el.innerHTML = errs.map((e,i)=>
    `<div class="e"><button class="btn play" onclick="play('${e.audio}')">▶</button><span>${esc(e.meta)}</span><span>你答：<span class="bad">${esc(e.user)||"—"}</span></span><span>答案：<span class="ans">${esc(e.ans)}</span></span><button class="btn ghost" onclick="rmErr(${i})">移除</button></div>`).join("");
}
function rmErr(i){ errs.splice(i,1); saveErrs(); renderErrs(); renderHome(); }

/* ================= 初始化 ================= */
renderHome(); renderRules(); renderTiles(); renderDlgs();
</script>
<!-- 播放条浮层 -->

  <div class="pbinner">
    <button id="pbToggle" class="btn play" onclick="togglePb()">⏸</button>
    <span id="pbName" class="pbname"></span>
    <input type="range" id="pbSeek" min="0" max="1000" value="0"
      oninput="dragSeeking=true; document.getElementById('pbTime').textContent=fmtT(curAudio&&curAudio.duration? (this.value/1000*curAudio.duration):0)+' / '+fmtT(curAudio?curAudio.duration:0)"
      onchange="dragSeeking=false; seekTo(this.value)">
    <span id="pbTime">0:00 / 0:00</span>
    <select id="spdSel" onchange="setSpd(this.value)" title="语速">
      <option value="0.75">0.75×</option>
      <option value="1">1×</option>
      <option value="1.2" selected>1.2×</option>
      <option value="1.25">1.25×</option>
      <option value="1.5">1.5×</option>
    </select>
    <button class="btn ghost" onclick="closePb()" title="关闭">✕</button>
  </div>
</div>
